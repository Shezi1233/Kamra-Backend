[project]
name = "kamora-backend"
version = "1.0.0"
description = "Kamora Tech FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "starlette>=0.46.0",
  "uvicorn>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary]>=3.1.18",
  "cryptography>=42.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "python-multipart>=0.0.9",
  "bcrypt>=4.2.0",
  "alembic>=1.13.0",
  "boto3>=1.34.0",
  "httpx>=0.27.0",
  "openai>=1.50.0",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "black>=24.0.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
